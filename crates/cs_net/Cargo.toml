[package]
name = "cs_net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration-test binary per crate (task #1561, convention of #1542):
# `autotests = false` leaves only the `[[test]]` target below, and every former
# `tests/*.rs` file is a `mod` of `tests/main.rs`. `cs_xtask test-layout` fails
# when a file under `tests/` is not reached from it.
autotests = false

[[test]]
name = "cs_net_tests"
path = "tests/main.rs"

[dependencies]
cs_types.workspace = true
# The pinned F54-B transport (see docs/findings/2026-10-03-f54-b-*). Exact
# versions are frozen per spec F54 non-negotiable 1; Cargo.lock + --locked
# keeps the transitive set frozen too.
renet2 = { version = "=0.16.1", default-features = false }
renet2_netcode = { version = "=0.16.1", default-features = false, features = [
    "native_transport",
] }
# Pinned transitively as well: renet2_netcode ^0.16.1 would otherwise float to
# a newer patch; the whole transport wave stays at the 2026-09-18 release.
renetcode2 = { version = "=0.16.1" }

[dev-dependencies]
libc = "=0.2.189"
# The pinned transports log through the `log` facade; the F54-X10 probe
# installs a counting logger to see which handshake stages complete.
log = "=0.4.34"
