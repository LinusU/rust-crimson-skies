[package]
name = "cs_formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cs_types.workspace = true
# Pure-Rust DEFLATE/zlib (no C toolchain, no system zlib): the bounded
# decoder `cs_formats::read_member` needs for spec F05 non-negotiable #3
# ("compressed data uses a bounded zlib decoder only after the entry extent
# is established"). Its exact byte accounting is what lets the reader report
# the trailing bytes a stream did not consume (non-negotiable #4). The crate
# was already in Cargo.lock through Bevy's asset stack, so this adds no new
# package to the graph.
miniz_oxide = "0.9"

[dev-dependencies]
cs_assets.workspace = true
# The retail acceptance test of F05-D re-reads every member of the original
# containers the way the pinned reference extractor ([S05], which hands the
# record's *first* length word to zlib and lets the stream end bound the
# read) and compares those bytes with the production reader's. It needs a
# zlib decoder of its own to do that; the crate already depends on this
# exact version, so this adds no package to the graph and no lock entry.
miniz_oxide = "0.9"
