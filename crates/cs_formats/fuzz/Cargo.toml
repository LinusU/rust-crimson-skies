[package]
name = "cs_formats-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.98"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cs_formats = { path = ".." }
cs_types = { path = "../../cs_types" }

# The fuzz crate is deliberately not a workspace member: it is only ever
# built by `cargo fuzz` under the nightly toolchain libFuzzer needs.
[workspace]

[[bin]]
name = "rof_directory"
path = "fuzz_targets/rof_directory.rs"
test = false
doc = false
bench = false

