[package]
name = "cs_script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# One integration-test binary per crate (task #1559, convention from #1542).
# `autotests = false` turns component auto-discovery off, so cargo links and
# runs exactly the one `[[test]]` target below instead of one per
# `tests/*.rs` file (macOS scans each fresh binary for ~50-70 s on first
# launch). Every former test file is a `mod` of `tests/main.rs`;
# `cs_xtask test-layout` fails when a `.rs` file under `tests/` is not reached.
autotests = false

[dependencies]
cs_types.workspace = true

[dev-dependencies]
# The F38-B acceptance test measures authored UI-script bytes with the
# production reader (`cs_formats::script_raw::ui_host_calls`) and then feeds the
# measurement to `cs_script::bindings::observed`; the evidence harness hashes the
# installation with `cs_assets::install`. `cs_script` itself does **not** link
# either crate (`docs/01-ARCHITECTURE.md`: `cs_script` may depend on `cs_types`
# only); these are test-only edges, the same shape as `cs_content`'s test-only
# `cs_sim` edge.
cs_assets.workspace = true
cs_formats.workspace = true
# The M01-LC lowering acceptance test checks that
# `cs_script::ir::DirectiveOperation` publishes a variant for every operation
# code `cs_content::mission_control::DirectiveOperation::code()` measures, so
# the two copies of the measured vocabulary cannot drift apart — the same
# test-only edge `cs_content` uses for `cs_net` and `cs_sim`. `cs_script`
# does not link `cs_content`.
cs_content.workspace = true

[[test]]
name = "cs_script_tests"
path = "tests/main.rs"
