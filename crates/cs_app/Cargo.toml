[package]
name = "cs_app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[dependencies]
avian3d.workspace = true
bevy.workspace = true
# `cs_assets` is a production dependency of `src/loading.rs` and
# `src/assets.rs` (F15-A): the load transaction is stamped with content
# session generations and its items name their derived cache keys, and the
# campaign acceptance tests in `tests/campaign/` also use its installation
# discovery and SHA-256, re-measured independently of the code under test.
# `cs_formats` is a production dependency of `src/livery.rs` (F09-C) and
# `cs_content` of `src/livery.rs` (F09-C) and `src/scene.rs` (F11-A, the
# scene binding records).
cs_assets.workspace = true
cs_content.workspace = true
cs_formats.workspace = true
# `cs_net` is a production dependency of `src/network/physics.rs` (F57-A): the
# receiver boundary decodes the F57-A snapshot schema and consumes the
# idempotent lifecycle events that retire remote actors.
cs_net.workspace = true
cs_sim.workspace = true
cs_types.workspace = true
# `src/capital.rs` (F35-A) names `cs_script::ir::ActorId`, the actor identity
# the `cs_sim::capital` aggregate is keyed by; `cs_sim` re-exports neither it
# nor a substitute, so the boundary depends on the crate that owns it.
cs_script.workspace = true
# `rodio` is a production dependency of `src/audio/device.rs` (task #635): the
# audible `AudioDevice` opens the machine's default output stream and plays
# decoded sound-archive members through it. It is the same crate `bevy_audio`
# already compiles into this workspace, named directly rather than reached
# through `bevy::audio`, because the device boundary is `&mut dyn AudioDevice`
# with no `World` and therefore cannot go through Bevy's `AudioSink` entities.
# Only `playback` is enabled — no codec and no recording feature — because this
# crate decodes original members itself (F06-C) rather than handing files to a
# decoder.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
# `image` is a production dependency of `src/ui/front_end/retail.rs` (F45-D):
# the original front-end screen artwork of `GOSDATA/ASSETS/crimson.rof` is
# stored as PNG/JPEG/TGA/BMP, and this is the decoder Bevy already compiles
# into this workspace through `bevy_image`. It is named directly so the front
# end can measure and draw those original images instead of reporting them
# unread; the version is the one Cargo.lock already resolves, and only the
# four decoders this stage reads are enabled.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }

[[bin]]
name = "cs"
path = "src/main.rs"
