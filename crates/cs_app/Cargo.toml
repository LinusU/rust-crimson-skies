[package]
name = "cs_app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[dependencies]
avian3d.workspace = true
bevy.workspace = true
cs_content.workspace = true
cs_formats.workspace = true
cs_sim.workspace = true
cs_types.workspace = true

# The campaign acceptance tests in `tests/campaign/` exercise the F50-A
# binding/coverage records and the M01-A source-derived binding; they are
# integration tests. `cs_assets` (installation discovery and SHA-256,
# re-measured independently of the code under test) is a dev-dependency of
# this crate only; `cs_content` and `cs_formats` are now production
# dependencies of `src/livery.rs` (F09-C).
[dev-dependencies]
cs_assets.workspace = true

[[bin]]
name = "cs"
path = "src/main.rs"
