name: CI

on:
  push:
  # Rally's lander (land.yml) pushes with GITHUB_TOKEN, which triggers no workflows, so it starts CI
  # on the rebased branch through workflow_dispatch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    # Lint and the tests run on separate runners, and cs_app's tests (138 of ~380 engine-linked test
    # binaries) on a runner of their own: on one runner `cargo test --workspace` left main with
    # 521 MB free on 2026-10-07, and with lint split off still only 4.5 GB.
    strategy:
      fail-fast: false
      matrix:
        check: [lint, test-app, test-rest]
    name: rust (${{ matrix.check }})
    env:
      # The workspace's test binaries no longer fit the runner's disk with full debug info: the
      # linker dies with SIGBUS (signal 7) while writing a doctest binary. Line tables keep panics'
      # file:line and cut the binaries to a fraction; incremental output is never reused in CI.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # The cargo test commands below also drop the line tables of every dependency
      # (`profile.dev.package."*".debug=false`): on Linux each test binary links its own copy of
      # Bevy's DWARF, and cs_app's ~170 test binaries filled the test-app runner to 29 MB free on
      # 2026-10-09 (ld SIGBUS, #809). The workspace's own crates keep their line tables (T430).
    steps:
      # The workspace's ~380 test binaries each link Bevy, so drop every preinstalled toolchain this
      # job does not use. Rust comes from rustup in ~/.rustup, and the system python3 stays.
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google /opt/az \
            /usr/lib/jvm /usr/share/miniconda
          sudo docker image prune --all --force > /dev/null || true
          sudo swapoff -a && sudo rm -f /swapfile /mnt/swapfile || true
          df -h

      - uses: actions/checkout@v5

      - name: Check for a Cargo workspace
        id: workspace
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Cargo workspace yet (F00-A creates it); skipping Rust checks."
          fi

      - name: Install Bevy system dependencies
        if: steps.workspace.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install the toolchain from rust-toolchain.toml
        if: steps.workspace.outputs.present == 'true'
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.workspace.outputs.present == 'true'
        with:
          key: ${{ matrix.check }}

      - name: cargo fmt
        if: steps.workspace.outputs.present == 'true' && matrix.check == 'lint'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: steps.workspace.outputs.present == 'true' && matrix.check == 'lint'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test (cs_app)
        if: steps.workspace.outputs.present == 'true' && matrix.check == 'test-app'
        run: cargo test -p cs_app --locked --config 'profile.dev.package."*".debug=false'

      - name: cargo test (every other member)
        if: steps.workspace.outputs.present == 'true' && matrix.check == 'test-rest'
        run: cargo test --workspace --locked --exclude cs_app --config 'profile.dev.package."*".debug=false'

      - name: Disk after the checks
        if: always()
        run: df -h

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Synthetic fixtures are reproducible
        run: |
          python3 tools/make_synthetic_fixtures.py --out "$RUNNER_TEMP/fixtures"
          for f in "$RUNNER_TEMP"/fixtures/*; do cmp "$f" "fixtures/synthetic/$(basename "$f")"; done

      - name: No binary files outside the synthetic fixtures
        run: |
          bad=$(git ls-files -z | xargs -0 -n1 sh -c 'case "$0" in fixtures/synthetic/*) ;; *) if [ -s "$0" ] && ! grep -Iq . "$0"; then echo "$0"; fi ;; esac')
          if [ -n "$bad" ]; then echo "Binary files need owner review:"; echo "$bad"; exit 1; fi
