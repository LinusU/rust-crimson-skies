[workspace]
resolver = "3"
members = [
    "crates/cs_app",
    "crates/cs_assets",
    "crates/cs_content",
    "crates/cs_formats",
    "crates/cs_net",
    "crates/cs_script",
    "crates/cs_sim",
    "crates/cs_types",
    "tools/cs_inspect",
    "tools/cs_xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# Intended baseline (docs/research/SOURCES.md, S01/S11): Bevy 0.19 + Avian3d 0.7.
# The caret ranges cannot drift to a different minor; the exact patch is pinned
# in Cargo.lock and every downstream gate runs with --locked.
#
# The list below is Avian's default feature set, spelled out so a future
# default cannot drift the pinned baseline.
#
# `collider-from-mesh` is in it, and it is only safe because
# `cs_app::asset_stack` installs a *real* Bevy asset stack — `AssetPlugin`
# plus `MeshPlugin`, which is where `init_asset::<Mesh>()` lives — in every
# world that adds `PhysicsPlugins::default()`. The feature registers
# `ColliderCachePlugin::clear_unused_colliders` (a
# `MessageReader<AssetEvent<Mesh>>`) and
# `init_collider_constructor_hierarchies` (a `Res<Assets<Mesh>>`); in a world
# without the stack the first `App::update` aborts with "Message not
# initialized" / "Resource does not exist". Do not switch the feature off to
# dodge that, and do not satisfy the readers with a bare `Assets<Mesh>`: the
# coupling is the contract, and a bare resource would hide it. The measurement
# and its resolution are recorded in docs/findings/ (task #333).
avian3d = { version = "0.7", default-features = false, features = [
    "3d",
    "collider-from-mesh",
    "f32",
    "parry-f32",
    "debug-plugin",
    "xpbd_joints",
    "parallel",
    "bevy_scene",
    "bevy_picking",
] }
bevy = "0.19"

cs_app = { path = "crates/cs_app" }
cs_assets = { path = "crates/cs_assets" }
cs_content = { path = "crates/cs_content" }
cs_formats = { path = "crates/cs_formats" }
cs_net = { path = "crates/cs_net" }
cs_script = { path = "crates/cs_script" }
cs_sim = { path = "crates/cs_sim" }
cs_types = { path = "crates/cs_types" }

# The CI runner's disk is the build budget this workspace has to live inside
# (task #430, docs/findings/2026-09-30-t430-rust-lld-sigbus-in-ci.md).
# Measured inside the failing `rust` job of run 36736183776 on the ubuntu24
# image: the root filesystem held 1.91 GiB free (99% used) while
# `cargo test` ran, and the job died a few seconds into linking the merged
# `cs_app` doctest — the largest single write of the run — with
# `collect2: fatal error: ld terminated with signal 7 [Bus error]` in
# rust-lld's writer threads, which is what an mmap'd output file that cannot
# be written looks like. The doctest binary lands in `/tmp`, on that same
# filesystem.
#
# Full DWARF is what spends that budget: `debug = 2`, rustc's default, is
# 61% of a dependency rlib by bytes and 14x its code (measured:
# `libbevy_pbr.rlib` is 169.5 MB, of which 102.7 MB is `__debug_*` — 77.9 MB
# of it `__debug_str` — against 7.1 MB of `__text`), and most of the linked
# doctest binary that tips the disk over. `line-tables-only` keeps `file:line`
# in panic backtraces and drops the type, variable and name DWARF: 4.9 MB of
# the 102.7 MB above is the line program that survives.
#
# `incremental` is deliberately *not* set here: the runner already exports
# CARGO_INCREMENTAL=0 (same run), and disabling it in the manifest would only
# slow the owner's local edit-build loop.
[profile.dev]
debug = "line-tables-only"

# Keep the linked `__eh_frame` under the Apple linker's 16 MiB compact-unwind
# encoding limit (task #336, docs/findings/2026-09-23-t336-*): at opt-level 0
# the dependency graph emits ~17 MiB of DWARF unwind data, so FDEs past the
# 16 MiB mark get compact-unwind entries whose dwarf offset wraps to 0 —
# unwinding through those frames aborts instead of unwinding. Optimizing
# dependencies shrinks the section back under the limit. This is also the
# upstream-recommended dev setting for Bevy: unoptimized engine code is too
# slow to run interactively.
[profile.dev.package."*"]
opt-level = 3
