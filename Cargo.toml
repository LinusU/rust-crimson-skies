[workspace]
resolver = "3"
members = [
    "crates/cs_app",
    "crates/cs_assets",
    "crates/cs_content",
    "crates/cs_formats",
    "crates/cs_net",
    "crates/cs_script",
    "crates/cs_sim",
    "crates/cs_types",
    "tools/cs_inspect",
    "tools/cs_xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# Intended baseline (docs/research/SOURCES.md, S01/S11): Bevy 0.19 + Avian3d 0.7.
# The caret ranges cannot drift to a different minor; the exact patch is pinned
# in Cargo.lock and every downstream gate runs with --locked.
#
# Avian's default `collider-from-mesh` feature is deliberately switched off
# (everything else below is the default feature set verbatim): it registers
# `ColliderCachePlugin::clear_unused_colliders` and
# `init_collider_constructor_hierarchies`, which read `AssetEvent<Mesh>` and
# `Assets<Mesh>` and therefore assume Bevy's asset stack. The F00-A synthetic
# scene is asset-free and headless — it adds no `AssetPlugin`, so the first
# `App::update` aborts with "Message not initialized" / "Resource does not
# exist". Provisioning an empty `Assets<Mesh>` would only hide the coupling, so
# mesh-derived colliders are re-enabled together with a real asset stack in the
# rendering/asset tasks (recorded in docs/findings/).
avian3d = { version = "0.7", default-features = false, features = [
    "3d",
    "f32",
    "parry-f32",
    "debug-plugin",
    "xpbd_joints",
    "parallel",
    "bevy_scene",
    "bevy_picking",
] }
bevy = "0.19"

cs_app = { path = "crates/cs_app" }
cs_assets = { path = "crates/cs_assets" }
cs_content = { path = "crates/cs_content" }
cs_formats = { path = "crates/cs_formats" }
cs_net = { path = "crates/cs_net" }
cs_script = { path = "crates/cs_script" }
cs_sim = { path = "crates/cs_sim" }
cs_types = { path = "crates/cs_types" }
