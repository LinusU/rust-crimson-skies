[package]
name = "cs_xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# One integration-test binary per crate (task #1562, convention from #1542).
# `autotests = false` turns component auto-discovery off, so cargo links and
# runs exactly the one `[[test]]` target below: on the owner's laptop every
# freshly linked test binary waits ~50-70 s for a macOS XProtect scan on its
# first launch. Every former test file is a `mod` of `tests/main.rs`;
# `cs_xtask test-layout` (and its acceptance test, which CI's
# `cargo test --workspace` runs) fails when a `.rs` file under `tests/` is not
# reached from that one target.
autotests = false

[[test]]
name = "cs_xtask_tests"
path = "tests/main.rs"

# Neither src/ file carries a #[test], yet `cargo test` still builds a
# harness binary for each and execs it out of target/. Any writer that
# pulls that file away between cargo's freshness check and the exec yields
# the intermittent `error: test failed, to rerun pass 'cs_xtask --lib'` +
# `No such file or directory (os error 2)` (on macOS a binary already
# running during a relink is SIGKILLed instead). Two writers are known:
# a second cargo relinking the same target directory (task #610's
# reproduction), and an external pruner unlinking old executables from
# target/debug/deps (measured in #617, which found no second cargo in its
# occurrences; see #613 and docs/findings/2026-10-04-t617-*). `test = false`
# does not stop either writer; it removes the two empty harnesses from the
# plan, so there are two fewer files to lose and nothing to relink for
# them. It stands on that alone and does not prevent the flake for crates
# that have real unit tests. The integration suites in tests/ are
# unaffected, and accept_t610_ pins the no-unit-tests invariant this
# relies on.
[lib]
test = false

[[bin]]
name = "cs_xtask"
test = false

[dependencies]
# PNG/JPEG decode, encode and resampling for `parity` (task #1646); the same
# package and version `cs_app` already pins, so the graph gains no package.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
