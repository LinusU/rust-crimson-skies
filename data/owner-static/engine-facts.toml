claim = "OWNER-STATIC-2026-10-17"
provenance = "static"
va = 0x61fb88
kind = "f32"
value = 6.0
meaning = "local offset of the formation slot, x, when the leader is the player (basis row 0 of the leader); the table at 0x41e792 selects this vector for a player leader"

