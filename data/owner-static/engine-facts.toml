# The `Cockpit views` command (id 49, F8; PARITY3-COCKPIT-VIEW.01, #1809,
# finding docs/findings/2026-10-21-parity3-cockpit-view-01-original-view-cycle.md).
# The registration `push 0x489340 / push 0x31 / call 0x537bf0` at 0x4896ba
# binds command 49 to the handler at 0x489340. The handler reads the camera
# mode at [camera + 0x14c] and calls the mode setter 0x42c280 with the `to`
# mode below; a mode outside {0, 6, 7} goes to the remembered mode at
# [0x62137c] (initially 6, written by the setter at 0x42c2ff whenever the new
# mode is 0, 6 or 7). The names of the modes and the mission's start mode are
# unmeasured (recorded unknown in the finding). Not `verified_original`.
[view_cycle]
claim = "OWNER-STATIC-2026-10-21"
provenance = "static"
command = 49
registration_va = 0x004896ba
handler_va = 0x00489340
mode_setter_va = 0x0042c280
mode_field_offset = 0x14c
remembered_mode_va = 0x0062137c
remembered_mode_initial = 6

# `va` is the instruction that loads the `to` mode into esi.
[[view_cycle_step]]
claim = "OWNER-STATIC-2026-10-21"
provenance = "static"
va = 0x0048937c
from = 0
to = 7

[[view_cycle_step]]
claim = "OWNER-STATIC-2026-10-21"
provenance = "static"
va = 0x00489371
from = 7
to = 6

[[view_cycle_step]]
claim = "OWNER-STATIC-2026-10-21"
provenance = "static"
va = 0x00489378
from = 6
to = 0

# The turret update law (FLAK-A-TURRET-UPDATE-LAW, #1819, finding
# docs/findings/2026-10-21-flak-a-turret-update-law.md). One row per cited
# instruction in the engine image: `va` is the instruction, `bytes` its
# machine code as hex (re-read by the ignored image test), `fact` what the
# instruction decides. The TURRET record parser is 0x4a9d00..0x4aa8a0, the
# per-turret update is 0x4aabb0..0x4ab53b, the aim step 0x4ab550..0x4abe2c,
# the target search 0x41f9c0 with the scorer 0x4ac720, the generic weapon fire
# 0x5aef40 and the rocket update around 0x5afd50..0x5b0770. Provenance
# `static`; nothing here is `verified_original`.

