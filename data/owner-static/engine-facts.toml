# The Flight Check's gun and rocket lists (#1670 M01-LC-FC-B, finding
# docs/findings/2026-10-19-m01-lc-fc-b-flight-check-gun-and-rocket-lists.md).
#
# The Flight Check script fills its four list controls with
# `callback($$E$$, 2005..2008, index, buffer)`. The `$$E$$` host function is
# `dispatcher_va` (it switches on `id - 2000` through the dword table at
# `jump_table_va`); ids 2005 and 2007 land on `gun_list_va`, 2006 and 2008 on
# `rocket_list_va`. Index -1 answers the item count (`list_items`, stored by
# those handlers), any other index is one numbered line. A handler resolves
# the slot (-1 pilot, -2 wingman) through `slot_resolver_va`: the selection
# cell at `selection_cells_va + 4 * slot`, and when that holds -3 the default
# cell at `default_cells_va + 4 * slot`. The result indexes the live plane
# record array (`record_array_va`, `record_stride` bytes each, `record_count`
# records). In the record: the gun slots, their ammunition kinds, the
# pair-mask byte and the rocket slots sit at the offsets below. Names are
# string-table ids (`gun_label_base + gun`, `ammo_label_base + kind`,
# `rocket_label_base + rocket`); a gun of `gun_none` / a rocket of
# `rocket_none` is shown as an empty line.
#
# The roster init (`roster_init_va`) stores the roster base at
# `roster_pointer_va`, resets both selection cells to -3 and the default cells
# to 0 (pilot) and 1 (wingman); `pilot_copy_va` / `wingman_copy_va` copy
# roster records 11 and 12 into live records 0 and 1. A line is shown for gun
# item `n` when slot `n >> 1` holds a gun, and for an odd `n` only when bit
# `n >> 1` of the pair mask is set; the item-number prefix is the string
# `item_number_string`, formatted with the item index plus one.
