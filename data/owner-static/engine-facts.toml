# The (gun, ammunition) -> weapon-record map the engine's loadout binder
# uses (#1628 M01-WINDOW-FIRE-GUN-LOADOUT, finding
# docs/findings/2026-10-19-m01-window-fire-gun-loadout.md).
#
# `bind_va` reads a live plane record's pair-mask byte, gun ids, ammunition
# kinds and rocket ids (offsets +0x84/+0x88/+0x98/+0xa8, the same layout
# `[flight_check_layout]` names) and builds each object's weapon set. When
# `mode_cell_va` reads 1 the pilot's record is `record_array_va` +
# `pilot_cell_va` * `record_stride` (the pilot's default cell,
# `[flight_check_layout]`'s `default_cells_va`), the wingman's the same
# through `wingman_cell_va`. Per gun slot `map_va` answers the weapon index
# `gun_base_<gun> + ammo`: `gun` above `gun_max` or `ammo` equal to
# `ammo_none` answers no record, kinds 1..=3 add their value to the base,
# every other kind adds 0. `name_va` spells the index `wep_%2d`
# (`format_va`) and resolves the record through `resolve_va` onto a mount
# emitter when bit (4 + slot) of the pair mask is set; otherwise the index
# stays in the object's gun list at `gun_index_array_va` and `select_va`
# stores the first slot `resolve_va` answers as the object's current gun,
# spelling it through the `wep_??` template at `template_va` with the tens
# and units digits written at `template_va + 4` and `template_va + 5`.
