# The OrdinanceLayout screen's rocket table and plane-record readings (#2069
# F2066-B, finding docs/findings/2026-10-24-parity5-ordinance-feed.md).
#
# `E 2028` counts and names the rocket rows through a table of twelve
# eight-byte records at `table_va` (`count_va` counts, `nth_va` answers the
# record index of the n-th row, `row_of_va` answers the row of a rocket id:
# the number of passing records among `0..=id`, minus one). A record
# (`first`, `aux` as two little-endian dwords) passes when any of the three
# flag cells (`flag_a_va`, `flag_b_va`, `flag_c_va`) is non-zero, or when
# `first <= progress_cell + 1`. `progress_cell_va` and the three flag cells
# lie in the zero-initialised tail of `.data`, so the image holds no starting
# value for them: what they mean in the campaign is unread. `aux` is read by
# none of the three functions. `E 2031` answers `-1` for a rocket box the
# plane record lacks: boxes below four against the dword at
# `box_low_count_offset`, boxes four and up against the dword at
# `box_high_count_offset` plus `box_high_bias`. `E 2036` / `E 2037` store the
# ammunition kind / the record index `nth_va` answers for the chosen row into
# the working copy at `draft_va` (stride `record_stride`, the record layout of
# `[flight_check_layout]`); `E 2035` loads the working copy from the live
# record and `E 2034` copies it back.
[ordinance_feed]
claim = "OWNER-STATIC-2026-10-24"
provenance = "static"
table_va = 0x619efc
table_entries = 12
count_va = 0x40ff00
nth_va = 0x40ff50
row_of_va = 0x40ffa0
flag_a_va = 0x647b5c
flag_b_va = 0x647b68
flag_c_va = 0x647b6c
progress_cell_va = 0x64b678
# Where the three flag cells are named. The start-up registration at
# 0x402030..0x4020e0 pushes `(name, cell, 1, 0, 0)` per variable for 0x406ff0;
# `*_register_va` is the pushed cell address's operand, `*_name_va` the
# NUL-terminated name it is registered under: flag_a "fAllowAll", flag_b
# "fMultiPlayerConstruction", flag_c "fIAConstruction". No instruction stores to the
# three cells (they are only read and compared); the registration passes their
# addresses on, and whether 0x406ff0 writes through them is unread. No script of the
# installation names them (docs/findings/2026-10-24-parity5-ordinance-draft.md).
flag_a_register_va = 0x4020d5
flag_a_name_va = 0x61e824
flag_b_register_va = 0x40205d
flag_b_name_va = 0x61e7dc
flag_c_register_va = 0x40207b
flag_c_name_va = 0x61e7f8
# The three stores to the progress cell, each an operand address (the dword there
# is the cell's address): in the function at 0x405ce0 the cell becomes the larger of
# itself and `progress_count_va` (0x405d84); the handler at 0x409f27 sets it to the
# count minus one after clamping the count to 24 (0x40a029); the new-campaign reset at
# 0x41144b..0x411477 zeroes it together with the count (0x411473). The meaning of the
# count cell (a mission count) is a reading, not a verified fact.
progress_max_store_va = 0x405d84
progress_count_store_va = 0x40a029
progress_reset_store_va = 0x411473
progress_count_va = 0x64b340
ammo_rows = 5
ammo_row_base = 3360
rocket_row_base = 3395
gun_name_base = 3320
box_low_count_offset = 0x34
box_high_count_offset = 0x38
box_high_bias = 4
draft_va = 0x6480cc
draft_ammo_va = 0x648164
draft_rocket_va = 0x648174
# The roster records 11 and 12 (`[[flight_check_default]]`) carry 2 and 2.
default_box_low_count = 2
default_box_high_count = 2

