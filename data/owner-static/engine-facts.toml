provenance = "static"
name = "zsnd.pitch_setter.constant"
va = 0x00609408
bytes = "000048c7"
fact = "-51200.0f, the scale of the rate setter 0x5975a0 (so the span is 51,200 Hz above the 4,000 Hz floor)"

[[audio_fact]]
claim = "OWNER-STATIC-2026-10-22"
provenance = "static"
name = "zsnd.freq_fraction.law"
va = 0x005976e8
bytes = "d94124d86128d84c240cd84128e866f705003da0d700007607b8a0d70000eb0c3da00f0000"
