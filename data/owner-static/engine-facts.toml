# Owner-static engine facts (task #1432, OWNER-FACTS-TABLE).
#
# Owner ruling of 2026-10-14: facts and small tables recovered from the
# owner-supplied decrypted engine image may be committed to the repository,
# with citations. The executable itself, disassembly and decompiled code may
# not. Numbers and tables are facts, not code.
#
# Every row carries a `claim` id (the OWNER-STATIC-<date> id the fact was
# recorded under), the deciding virtual address `va` in the image (the file
# offset is `va - image_va_base`), and `provenance`. `static` means static
# analysis of the image; `designed` means an engine-authored development
# value the launch uses because the original's own value is not recovered.
# Nothing here is `verified_original`: no original executable ran.
#
# The launch binds from this file only when `CS_ENGINE_IMAGE` does not name
# the image (crates/cs_app/src/mission_start.rs); when it does, the image
# itself is the source and the ignored owner_facts_table image test re-reads
# these cited bytes so the table cannot silently drift.
#
# This file is parsed by crates/cs_app/src/engine_facts.rs, which accepts
# exactly the strict subset of TOML written here — comments, `key = value`
# scalars (string, integer in decimal or 0x hex, float, boolean), `[table]`
# headers and `[[row]]` arrays. An edit outside that subset fails the parse
# loudly, never silently.

schema_version = 1
image = "crimson.decrypted.exe"
image_sha256 = "43540fc97347210d6f4c10b77edbd4cdab1f03d57554d638223c2430a6c37d75"
image_va_base = 0x400000

# The stored-heading convention (#770, finding
# docs/findings/2026-10-08-m01-lc-campaign-airframe-engine-state.md): the
# sequence at `va` loads the record's field-2 degrees, multiplies by the
# image's own f64 at `constant_va` (π/180 to fourteen digits, not the double
# nearest π/180) and passes the f32 result to SetRotation(node, 0, yaw, 0).
[heading]
claim = "OWNER-STATIC-2026-10-08"
provenance = "static"
va = 0x47c4e5
bytes = 0x1c
constant_va = 0x6040e8
degrees_to_radians = 0.01745329251994
zero = "a yaw of 0 leaves the node's local axes on the world axes"
positive = "a positive yaw turns the local +Z axis toward +X"
compose = "0x53bf40 composes the (pitch, yaw, roll) triple stored at class+0x1c as M = Ry * Rx * Rz with right-handed matrices; the HUD's compass is given SetRotation(compass, 0, -yaw, 0) at 0x49f8ec and counter-rotates"

# The stored-position unit (#436 owner note of 2026-10-05): world units are
# metres, +Y up, right-handed; stored positions map to the canonical frame
# with an identity axis map and scale 1.0. `va` is the feet conversion site;
# the m/s to mph conversion at 0x453aa2 agrees.
[position]
claim = "OWNER-STATIC-2026-10-05"
provenance = "static"
va = 0x48fc40
metres_per_unit = 1.0
axes = "metres, +Y up, right-handed, identity axis map to the canonical frame; 0x48fc40 converts position.y to feet with *3.2808399 and 0x453aa2 converts m/s to mph with *2.2369363"

# The aiv.zrd aircraft-record layout (#1453 / M01-AIV-LAYOUT, finding
# docs/findings/2026-10-15-m01-aiv-layout.md): the field map of the record
# class the mission's aiv.zrd records are parsed into (the CCEVeh node,
# 0x158 bytes, ctor 0x43bf10), and the code sites that consume the fields.
# Each `*_field` is the zero-based index into a record's positional field
# list `[name, [f0 .. f80]]`; every retail aiv.zrd record measured carries
# `field_count` fields. `parse_va` is the parse routine that maps field index
# to document slot; `spawn_va` is the per-record spawn loop that dispatches on
# the record name; `loader_va` builds the vehicle from the template and the
# record; `sleep_va` reads the deactivated byte and calls the sleep routine
# (0x4b0f40, measured by #681); `team_va` / `group_va` write the team setter
# and the AI-group slot; `spawn_gate_va` is the enabled-field test that skips
# a record whose enabled field is zero; `name_dispatch_va` is the generic
# branch that truncates the record name at its last `_` and matches the
# vehicle registry; `vehicle_zrd_va` pushes the `vehicle.zrd` member name the
# registry is loaded from. The airframe/vehicle type of a scripted aircraft
# is NOT carried by any field: it comes from that name dispatch.
[aiv_layout]
claim = "OWNER-STATIC-2026-10-15"
provenance = "static"
parse_va = 0x437620
spawn_va = 0x474cd9
loader_va = 0x47c210
sleep_va = 0x47ca14
team_va = 0x47c674
group_va = 0x47c694
spawn_gate_va = 0x474d10
name_dispatch_va = 0x4752a8
vehicle_zrd_va = 0x474b5b
field_count = 81
netids_field = 0
position_field = 1
heading_field = 2
team_field = 3
group_field = 4
enabled_field = 5
primary_target_field = 6
title_field = 20
deactivated_field = 21

# The executable's airframe table (#715, finding
# docs/findings/2026-10-06-m01-lc-player-airframe-source.md): eleven rows of
# seven pointers, 0x620c70..0x620da4, in index order — the table the
# name-to-index routine at 0x426d80 resolves `player_plane` names through
# (comparing case-insensitively and answering 11 for no match). The fields of
# each row below are written in the image's own pointer order — display,
# scene_root, p, r, w, model, base — of which only three meanings are
# measured: `display` is what a document writes and the routine compares,
# `scene_root` is the node support\planes.gw creates, and `model` is the
# common\planes\<model>\<model>.flt it loads. The remaining four pointers
# are transcribed but uninterpreted — row 5's `w` field is the literal
# `wingman`, not `wdevastator`, and `p` is the record name the launch's
# flight law consumes.
