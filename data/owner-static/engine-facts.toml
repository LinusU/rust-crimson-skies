fact = "0x597740(handle, m) sets rate = clamp(ftol(ftol(desc[+0x2c]) * m), 4000, 55200) Hz through SetFrequency (0x597813): a multiplier on the descriptor float at +0x2c (the sound base rate; its origin is not decoded)"

[[audio_fact]]
