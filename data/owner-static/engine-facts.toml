# The M01 audio timeline (task #1862, PARITY6-M01-AUDIO-TIMELINE.02, finding
# docs/findings/2026-10-22-m01-audio-timeline-voice-laws.md): the zSound
# volume, pan and rate laws and the aircraft engine/prop voice laws read from
# the decrypted image. `bytes` are the cited image bytes at `va`; `fact` states
# what the bytes establish. Nothing here is verified_original.

[[audio_fact]]
claim = "OWNER-STATIC-2026-10-22"
provenance = "static"
name = "zsnd.pitch_setter.law"
va = 0x005975ee
bytes = "d944240cd80d08946000e863f80500b9a00f00002bc881f9a0d70000"
fact = "0x5975a0(handle, x) with the backend flag [0x639cb4]==0 computes rate = clamp(4000 - ftol(x * -51200.0f), 4000, 55200) Hz and calls SetFrequency (0x597624): x in 0..1 spans 4,000..55,200 Hz; the clamp immediates are 0xfa0 and 0xd7a0"

[[audio_fact]]
