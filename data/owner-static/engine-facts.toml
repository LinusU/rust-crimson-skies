[[audio_fact]]
claim = "OWNER-STATIC-2026-10-22"
provenance = "static"
name = "zsnd3d.rolloff"
va = 0x00597e6d
bytes = "d94120d8611cdc0d18946000d9450cd8611cd8d1dfe0f6c4417526d9c9d8f1d9edd9c9d9f1dc0d10946000da4510e8c0ef0500"
