fact = "0x45e470(ref, key, group, ttl, pos*, vel*) is a keyed voice-slot play: it finds or inserts the record for `key` (arg 2) in the map at 0x71b1e8 (0x45e670), and only when the record's voice handle [rec+0x10] is 0 starts the group (arg 3) through the 2D play 0x593590(group, 1.0f) (0x45e4ee) and stores the handle; an already-started record is not restarted. If a handle exists it calls 0x597af0(handle, arg5, arg6, 0) (0x45e50d) and sets the record expiry [rec+0x14] = [0x71b1f8] + arg4 (0x45e512..0x45e51f)"

