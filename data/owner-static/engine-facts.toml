# Development values the launch uses because the original's own are not
# recovered. `status = "designed"` values are choices, never measurements —
# they exist so a launch does not refuse on an unknown it cannot resolve.
[[provisional]]
name = "player_spawn_speed_m_s"
status = "designed"
claim = "OWNER-STATIC-2026-10-14"
provenance = "designed"
value = 55.0
reason = "the original's player spawn speed was never recovered (#796 records it as an open unknown, unresolved until an original run, #358), so the spawn velocity the launch gives the player is a declared development value — below the imported fd_speed cruise so a free flight begins with a run-up; it says nothing about the original"
