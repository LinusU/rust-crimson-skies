# The per-mission player airframe: one row per campaign mission directory in
# the installation. `status = "known"` rows carry the deciding `va` (the
# `.data` plane-roster record a fresh, profile-less campaign launch copies,
# whose +0x2c dword is `airframe_index`) and `record` — that airframe row's
# `p` field, the vehicle.zrd record the flight law imports. `status =
# "unknown"` rows carry `reason` instead: the refusal is the claim.
#
# #770 measured the engine-side default for every fresh, profile-less
# campaign launch (roster init 0x4113b0, selection index 0x411477 = 0,
# roster[0] +0x2c = 5, setter 0x41712c, spawn 0x474d48). It is committed as
# M01's player airframe because M01's launch is the measured path; for every
# other campaign mission no per-mission claim is committed — whether the
# mission's undecoded program or campaign progression changes the selection
# before launch is unmeasured.
[[mission]]
dir = "zbd/c1c/m01"
label = "M01"
status = "known"
claim = "OWNER-STATIC-2026-10-08"
provenance = "static"
va = 0x61a81c
airframe_index = 5
record = "pdevastator"

[[mission]]
dir = "zbd/c1/m02"
label = "M02"
status = "unknown"
claim = "OWNER-STATIC-2026-10-14"
provenance = "static"
reason = "no per-mission player airframe is committed for this mission: no campaign archive carries the player_plane key (#715), and whether campaign progression or the mission's undecoded mission-language statements (F13-B/C, F38) change the measured fresh-profile default before launch is unmeasured; the launch keeps the airframe unknown rather than assert the default"

